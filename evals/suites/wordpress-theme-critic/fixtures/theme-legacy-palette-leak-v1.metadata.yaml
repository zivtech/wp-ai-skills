name: theme-legacy-palette-leak-v1
suite: wordpress-theme-critic
skill_under_test: wordpress-theme-critic
skill_type: critic
difficulty_tier: focused
provenance: authored
risk_class: theme_json_theme_support_precedence
expected_wordpress_apis:
  - "theme.json"
  - "add_theme_support"
  - "wp_get_global_stylesheet"
expected_verification_surfaces:
  - "opening the Site Editor's color picker to see which palette swatches actually appear"
  - "checking global-styles-inline-css on a rendered page for the --wp--preset--color--* variables it emits"
must_detect:
  - "theme.json's settings.color object sets custom, customGradient, and defaultPalette but omits palette, so the legacy palette from functions.php's add_theme_support call is what editors actually see in the color picker"
  - "functions.php's add_theme_support('editor-color-palette', ...) call supplies an off-brand legacy palette that reaches editors only because theme.json leaves settings.color.palette unset, not because the theme support call overrides theme.json"
negative_space:
  - "does not claim add_theme_support overrides or takes precedence over a key theme.json sets; theme.json wins on any key it sets, and this defect exists only because theme.json omits the palette key"
  - "does not flag theme.json's custom, customGradient, or defaultPalette switches as misconfigured; only the missing palette key is the issue"
