fixture: migration-mode-component-heavy
skill_under_test: wordpress-planner.content-model
max_score: 10
criteria:
  - id: disposition_completeness
    weight: 3
    description: Every source content type, vocabulary, and component in the fixture gets exactly one disposition row.
  - id: component_disposition_rubric
    weight: 2
    description: Each component's disposition (custom block, core block plus pattern, synced pattern with overrides, flatten, or drop) states its criterion.
  - id: cardinality_and_vocabulary_gates
    weight: 2
    description: Cites source field cardinality and does not merge vocabularies co-attached to the same content type.
  - id: editorial_guardrails_and_storage_rule
    weight: 2
    description: Records a lock-level decision per content type and an editing surface for every bound field.
  - id: calibration_and_handoff
    weight: 1
    description: Calibrates uncertainty and names the downstream planner/executor/critic handoff.
